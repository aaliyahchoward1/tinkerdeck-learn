<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinkerDeck Learn - 3D Circuit Viewer</title>
    <meta name="description" content="Drag-and-drop 3D circuit puzzles for beginner Arduino lessons.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ccircle cx='30' cy='30' r='8' fill='%233b82f6'/%3E%3Ccircle cx='70' cy='30' r='8' fill='%238b5cf6'/%3E%3Ccircle cx='30' cy='70' r='8' fill='%238b5cf6'/%3E%3Ccircle cx='70' cy='70' r='8' fill='%233b82f6'/%3E%3Cpath d='M30 30L70 30M30 30L30 70M70 30L70 70M30 70L70 70' stroke='%23e2e8f0' stroke-width='4'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        #canvas {
            flex: 1;
            min-width: 0;
            width: 0;
            display: block;
        }

        .sidebar {
            width: 320px;
            background: #1e293b;
            border-left: 1px solid #334155;
            overflow-y: auto;
            padding: 24px;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            #canvas {
                width: 100%;
                height: 60vh;
            }

            .sidebar {
                width: 100%;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid #334155;
            }
        }

        .sidebar h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .lesson-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        .info-section {
            margin-bottom: 24px;
        }

        .info-section h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #cbd5e1;
        }

        .component-list {
            list-style: none;
        }

        .component-list li {
            font-size: 13px;
            padding: 6px 0;
            color: #cbd5e1;
        }

        .component-list li strong {
            color: #f1f5f9;
        }

        .controls {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #334155;
        }

        .controls p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .lesson-nav {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #334155;
        }

        .lesson-nav button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: #334155;
            border: 1px solid #475569;
            color: #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .lesson-nav button:hover {
            background: #475569;
        }

        .lesson-nav button.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-buttons button {
            flex: 1;
            padding: 8px 6px;
            background: #273449;
            border: 1px solid #475569;
            color: #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s;
        }

        .action-buttons button:hover {
            background: #334155;
        }

        .action-buttons button.active {
            background: #0ea5e9;
            border-color: #0ea5e9;
            color: #0f172a;
        }

        .validation-panel {
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 13px;
        }

        .validation-panel .all-correct {
            color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="sidebar">
            <h1>TinkerDeck Learn</h1>
            <div class="lesson-title" id="lesson-title">Lesson 1: Blink</div>

            <div class="info-section">
                <h2>Components</h2>
                <ul class="component-list" id="component-list"></ul>
            </div>

            <div class="info-section">
                <h2>Connections</h2>
                <ul class="component-list" id="connection-list"></ul>
            </div>

            <div class="controls">
                <p><strong>Controls:</strong></p>
                <p>🖱️ <strong>Drag components</strong> from the staging row into place<br>Scroll to zoom · Right-drag to pan</p>
                <p><small>Snaps to a 0.5-unit grid. Green outline = correct, red = needs adjusting.</small></p>
            </div>

            <div class="action-buttons">
                <button onclick="resetLesson()" title="Put all components back in the staging row">↺ Reset</button>
                <button id="hint-toggle" onclick="toggleHints()" title="Show where each piece belongs">💡 Hints</button>
                <button id="copy-link" onclick="copyLessonLink()" title="Copy a link to this lesson">🔗 Copy</button>
            </div>

            <div id="validation-status"></div>

            <div class="lesson-nav">
                <button class="active" onclick="loadLesson(1)">Lesson 1: Blink</button>
                <button onclick="loadLesson(2)">Lesson 2: Button Input</button>
                <button onclick="loadLesson(3)">Lesson 3: Sensor</button>
                <button onclick="loadLesson(4)">Lesson 4: LCD Display</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="js/viewer.js"></script>
</body>
</html>
